name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android klasorunu repoda tutmuyoruz; her derlemede olusturuyoruz.
      - name: Android iskeletini olustur
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --platforms=android --project-name kripto_cuzdan --org com.kriptocuzdan .
          rm -rf lib
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml
          rm -rf test

      # flutter_secure_storage en az Android 6 (API 23) ister.
      - name: minSdk 23 yap
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
          done

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kripto-cuzdan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
